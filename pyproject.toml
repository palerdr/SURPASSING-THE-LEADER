[project]
name = "stl-solver"
version = "0.1.0"
description = "Exact-second solver and AlphaZero-style training loop for Surpassing The Leader."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "gymnasium>=1.0,<2",
    "hydra-core>=1.3,<2",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "torch>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stl", "src/dth", "src/abstract", "src/arena"]

[dependency-groups]
dev = [
    "maturin>=1.14.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["src/stl/tests", "src/dth/tests", "src/abstract/tests", "src/arena/tests", "tests/meta"]
pythonpath = ["src", "."]

[tool.uv]
package = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
