[project]
name = "stl-solver"
version = "0.1.0"
description = "Independent exact-game implementations, accelerators, and neutral play surfaces for Surpassing The Leader."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "highspy>=1.12,<2",
    "hydra-core>=1.3,<2",
    "numpy>=2.0,<3",
    "pyyaml>=6.0,<7",
    "scipy>=1.14,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stl", "src/dth", "src/abstract", "src/arena", "src/terminal", "src/browser", "src/hal_lab"]

[dependency-groups]
dev = [
    "maturin>=1.14.1",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
]
# The torch Hal providers in src/arena/policies and the Hal lab's training
# stack. [tool.uv] default-groups installs this group with dev.
research = [
    "gymnasium>=1.0,<2",
    "sb3-contrib>=2.9,<3",
    "stable-baselines3>=2.9,<3",
    "torch>=2.5",
]

[tool.pytest.ini_options]
# The browser app's tests and the root tests/parity import FastAPI, which the
# browser project in src/browser/pyproject.toml installs. Run them with
# `uv run --project src/browser python -m pytest src/browser/tests tests/parity -q`.
testpaths = ["src/stl/tests", "src/dth/tests", "src/abstract/tests", "src/arena/tests", "src/terminal/tests", "src/hal_lab/tests", "tests/meta"]
pythonpath = ["src", "."]
# The suite is overwhelmingly independent and every artifact-building test
# already writes under its own tmp_path, so it distributes cleanly. Use "-n 0"
# when a failure needs a readable serial traceback.
#
# 8, not "auto": several tests import torch, and one worker per logical core
# (24 here) exhausts Windows handles while importing sympy and makes the
# workers fight over the GPU. 8 leaves headroom and still gets most of the win.
addopts = "-n 8"
# Runs by default -- under xdist these cost ~19s of wall clock and they are the
# only coverage of resume and backend parity, which is not worth trading away.
# Use -m "not slow" for a tighter loop when iterating on unrelated code.
markers = ["slow: builds a real complete-tablebase artifact end to end"]

[tool.uv]
package = true
# `uv run` and `uv sync` install both groups, so the root environment keeps
# torch and the training stack. The browser project's own lock holds FastAPI,
# so a browser dependency change leaves this project's uv.lock alone.
default-groups = ["dev", "research"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
