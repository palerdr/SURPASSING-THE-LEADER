[project]
name = "stl-solver"
version = "0.1.0"
description = "Exact-second solver and AlphaZero-style training loop for Surpassing The Leader."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "gymnasium>=1.0,<2",
    "hydra-core>=1.3,<2",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "torch>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stl", "src/dth", "src/abstract", "src/arena"]

[dependency-groups]
dev = [
    "maturin>=1.14.1",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
testpaths = ["src/stl/tests", "src/dth/tests", "src/abstract/tests", "src/arena/tests", "tests/meta"]
pythonpath = ["src", "."]
# The suite is overwhelmingly independent and every artifact-building test
# already writes under its own tmp_path, so it distributes cleanly. Use "-n 0"
# when a failure needs a readable serial traceback.
#
# 8, not "auto": several tests import torch, and one worker per logical core
# (24 here) exhausts Windows handles while importing sympy and makes the
# workers fight over the GPU. 8 leaves headroom and still gets most of the win.
addopts = "-n 8"
# Runs by default -- under xdist these cost ~19s of wall clock and they are the
# only coverage of resume and backend parity, which is not worth trading away.
# Use -m "not slow" for a tighter loop when iterating on unrelated code.
markers = ["slow: builds a real complete-tablebase artifact end to end"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
