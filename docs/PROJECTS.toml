schema_version = 1

# Import rules, which tests/meta/test_layer_boundaries.py enforces:
# - may_import lists the modules of other projects that this project can
#   import. Each entry must sit under a public interface of its owner. An
#   import inside the same project passes.
# - forbid_imports lists third-party packages that this project must not
#   import. forbid_imports_exempt lists the files, by repository path, that
#   can import them today. Each exempt file must exist and must still import
#   one of the packages, so the list shrinks as files move out.
# - core_modules can import each other and the modules in core_may_import,
#   and no other first-party module.
#
# A [[consumer]] entry names a tracked directory outside src/ whose scripts
# import projects but own no importable module, such as paper/. It lists
# may_import alone, and the same test checks each of its scripts. An entry
# may name a flat module by its file, as main.py.

[[project]]
id = "stl"
path = "src/stl"
instruction_readme = "src/stl/README.md"
kind = "peer"
languages = ["python"]
rung = "L2"
status = "implemented-unsolved"
public_interfaces = ["stl.engine", "stl.solver.canonical", "stl.reader"]
may_import = []
forbid_imports = ["torch", "gymnasium", "stable_baselines3", "sb3_contrib"]
root_validation = true
validation = ["uv run python -m pytest src/stl/tests -q"]

