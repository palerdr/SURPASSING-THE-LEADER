# Maps the file keys of the frozen Hal evidence records to repository paths.
#
# hal_lab.provenance reads this file. The records keep their keys as written,
# and a change that moves a file edits this map, never a record.
schema_version = 1

# The checkout roots that absolute keys name. The verifier removes the root
# and reads the rest as a repository path at the pre-restructure tag.
absolute_roots = ["/Users/palerider/Desktop/projects/usogui/stl/"]

# Bare file names that records use as keys, with the repository path of each
# name at the pre-restructure tag.
[basename]
"bayesian_hal.py" = "src/arena/policies/bayesian_hal.py"
"evaluate_bayesian_hal.py" = "src/arena/policies/evaluate_bayesian_hal.py"
"perfect_hal.py" = "src/arena/policies/perfect_hal.py"

# The repository path at the pre-restructure tag, mapped to the current path.
# The list holds every frozen record and every tracked file that a record
# binds. The verifier reads a tracked binding from the tag, so the entry of a
# source file tells a reader where that file lives now. The verifier reads a
# record or an ignored output at its current path. A path that this table
# omits has not moved; the ignored outputs/ store stays in place.
[path]
# The play command of cli.py moved to src/terminal/cli.py, and its match
