schema_version: arena-aggro-hal-training-config-v2

model:
  hidden_size: 24
  gru_layers: 2
  head_hidden_size: 16
  gru_dropout: 0.0
  tactical_logit_scale: 8.0

training:
  seed: 20260808
  device: cpu
  cpu_threads: 2
  dth_artifact: src/dth/artifacts/complete_full_v1
  games_per_session: 2
  max_half_rounds: 2
  start_clocks: [720]
  sessions_per_update: 2
  warmstart_updates: 1
  ppo_updates: 1
  ppo_epochs: 1
  learning_rate: 0.001
  gamma: 0.995
  gae_lambda: 0.95
  ppo_clip: 0.20
  value_coef: 0.25
  entropy_coef: 0.003
  prediction_coef: 1.0
  ppo_prediction_coef: 0.25
  tactical_coef: 1.0
  direct_tactical_coef: 0.5
  ppo_tactical_coef: 0.15
  max_grad_norm: 1.0
  snapshot_interval: 1
