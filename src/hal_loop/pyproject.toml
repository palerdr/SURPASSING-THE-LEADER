[project]
name = "stl-hal-loop"
version = "0.1.0"
description = "The live opponent-modelling loop: Dagster assets, a dbt project on DuckDB, and an MLflow registry that fit the adaptive Hal's population prior from the hosted ledger."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dagster>=1.10",
    "dagster-dbt>=0.26",
    "dagster-webserver>=1.10",
    "dbt-duckdb>=1.9",
    "duckdb>=1.1",
    "httpx>=0.28.1",
    "mlflow>=2.20",
    "numpy>=1.26",
    "pyarrow>=18",
    "stl-solver",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The loop's package sits one level down, so the project installs it editable
# into its own environment, and `-m hal_loop.definitions` resolves anywhere.
packages = ["hal_loop"]

[tool.uv]
# The root package's hydra-core pins antlr4-python3-runtime 4.9, and Dagster's
# asset selection parser needs 4.13. hal_loop never imports hydra, so this
# override applies to the loop's environment alone.
override-dependencies = ["antlr4-python3-runtime>=4.13"]

[tool.uv.sources]
stl-solver = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# hydra-core registers a pytest plugin that imports omegaconf, and omegaconf's
# generated parser needs antlr 4.9. The override above installs 4.13.
addopts = "-p no:hydra_pytest"
