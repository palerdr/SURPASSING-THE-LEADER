schema_version: arena-aggro-hal-training-config-v2

model:
  hidden_size: 128
  gru_layers: 2
  head_hidden_size: 96
  gru_dropout: 0.0
  tactical_logit_scale: 12.0

training:
  seed: 20260808
  device: cpu
  cpu_threads: 6
  dth_artifact: src/dth/artifacts/complete_full_v1
  games_per_session: 8
  max_half_rounds: 24
  start_clocks: [720]
  sessions_per_update: 8
  warmstart_updates: 60
  ppo_updates: 30
  ppo_epochs: 3
  learning_rate: 0.0008
  gamma: 0.995
  gae_lambda: 0.95
  ppo_clip: 0.20
  value_coef: 0.10
  entropy_coef: 0.003
  prediction_coef: 5.0
  ppo_prediction_coef: 0.25
  tactical_coef: 0.5
  direct_tactical_coef: 0.25
  ppo_tactical_coef: 0.15
  max_grad_norm: 1.0
  snapshot_interval: 10
