<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Surpassing The Leader</title>
    <style>
      :root {
        --ink: #f2f2f2;
        --dim: #8a8a8a;
        --rule: #2b2b2b;
        --warn: #d8b24a;
        --bad: #c4544a;
        --good: #7fa87f;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #000;
        color: var(--ink);
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        display: flex;
        justify-content: center;
      }
      #app {
        width: min(880px, 100vw);
        padding: 20px 18px 32px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 8px;
      }
      h1 { font-size: 15px; letter-spacing: 0.22em; margin: 0; font-weight: 600; }
      #clock { font-variant-numeric: tabular-nums; color: var(--dim); }
      #meta, #roles { display: flex; gap: 14px; color: var(--dim); }
      #roles strong { color: var(--ink); font-weight: 600; }
      .leap { color: var(--warn); }
      canvas {
        width: 100%;
        aspect-ratio: 16 / 7;
        display: block;
        background: #000;
        border: 1px solid var(--rule);
        image-rendering: pixelated;
      }
      #stats { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .player { border: 1px solid var(--rule); padding: 10px 12px; }
      .player h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; letter-spacing: 0.08em; }
      .player .you { color: var(--dim); font-weight: 400; }
      .stat { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
      .stat span:first-child { width: 68px; color: var(--dim); }
      .bar { flex: 1; height: 8px; background: #141414; border: 1px solid var(--rule); }
      .bar > i { display: block; height: 100%; background: var(--ink); }
      .bar.hot > i { background: var(--bad); }
      .value { width: 62px; text-align: right; font-variant-numeric: tabular-nums; }
      #panel { border: 1px solid var(--rule); padding: 14px; min-height: 132px; }
      #panel h2 { font-size: 13px; margin: 0 0 10px; letter-spacing: 0.1em; }
      #panel p { margin: 0 0 8px; }
      #panel .rules { color: var(--dim); white-space: pre-wrap; margin-bottom: 12px; }
      #panel .arith { color: var(--dim); }
      #panel .win { color: var(--good); }
      #panel .lose { color: var(--bad); }
      form { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
      input[type="number"] {
        width: 96px; background: #0c0c0c; color: var(--ink);
        border: 1px solid var(--rule); padding: 7px 9px; font: inherit;
      }
      button {
        background: var(--ink); color: #000; border: 0; padding: 7px 16px;
        font: inherit; font-weight: 600; cursor: pointer;
      }
      button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
      button:disabled { opacity: 0.45; cursor: default; }
      .error { color: var(--bad); margin-top: 8px; min-height: 1.4em; }
      .hint { color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>SURPASSING THE LEADER</h1>
        <div id="clock"></div>
      </header>
      <div id="meta"></div>
      <div id="roles"></div>
      <canvas id="scene"></canvas>
      <div id="stats"></div>
      <div id="panel"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
