name = "formal"
version = "0.1.0"
defaultTargets = ["Formal", "FormalExtended", "FormalAudit"]
# Dependencies live under an ignored build directory so that vendored
# Markdown and Python never enter the repository's source scans.
packagesDir = "build/packages"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "Formal"

[[lean_lib]]
name = "FormalExtended"

[[lean_lib]]
name = "FormalAudit"
