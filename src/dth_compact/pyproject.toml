[project]
name = "dth-compact"
version = "0.1.0"
description = "The paper's one-file solver for pure Drop the Handkerchief: the complete 289,374,121-class tablebase in about a minute."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numba>=0.67.0",
    "numpy>=2.5.2",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
