[package]
name = "dth_complete_rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "dth_complete_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
numpy = "0.29"
pyo3 = "0.29"
rayon = "1.12"

[build-dependencies]
sha2 = "0.10"
