defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

# Generation five accumulates generation four's coverage plus the exact
# anchor-leaf closure.  Exact artifacts are listed after the resolve
# artifacts so exact rows win every collision, including play rows the
# anchor closure now covers exactly.
dataset_version: class_head_gen5_corpus
output: src/dth/artifacts/class_head_gen5_corpus.npz
emission: merge
inputs:
  - src/dth/artifacts/resolve_labeled_gen1.npz
  - src/dth/artifacts/resolve_labeled_gen2.npz
  - src/dth/artifacts/resolve_labeled_gen3.npz
  - src/dth/artifacts/readiness_training_reference_v2.npz
  - src/dth/artifacts/anchor_leaf_closure_v1.npz

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
