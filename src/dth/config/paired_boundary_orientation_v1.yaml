defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

# The primary orientation is the only supervised side.  Its exact role-swapped
# counterpart is emitted separately and must remain audit-only.
dataset_version: paired_boundary_orientation_v1
emission: paired_mirror_roots
train_orientation: primary
train_output: dth/artifacts/paired_boundary_orientation_v1_primary.npz
holdout_output: dth/artifacts/paired_boundary_orientation_v1_mirror.npz
progress_every: 25

# Every primary state is paired mechanically with
# [dropper_st, dropper_ttd, checker_st, checker_ttd].  The support spans the
# inclusive ST=240 switch and the strict ST+TTD>240 switch, alone and combined.
pairs:
  - state: [239, 0, 0, 0]
    horizons: [1, 3]
  - state: [240, 0, 0, 0]
    horizons: [1, 3]
  - state: [200, 40, 0, 0]
    horizons: [1, 3]
  - state: [200, 41, 0, 0]
    horizons: [1, 3]
  - state: [179, 61, 0, 0]
    horizons: [1, 3]
  - state: [179, 62, 0, 0]
    horizons: [1, 3]
  - state: [60, 180, 0, 0]
    horizons: [1, 3]
  - state: [60, 181, 0, 0]
    horizons: [1, 3]
  - state: [240, 0, 200, 40]
    horizons: [1, 3]
  - state: [200, 41, 240, 0]
    horizons: [1, 3]
  - state: [239, 1, 179, 61]
    horizons: [1, 3]
  - state: [239, 2, 179, 62]
    horizons: [1, 3]

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
