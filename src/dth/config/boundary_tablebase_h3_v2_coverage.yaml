defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

# V7 coverage expansion.  V1's roots are preserved, then four nearby but
# development-disjoint boundary pairs are added with their genuine role
# orientations.  All roots emit their H1/H2/H3 successor closure.
dataset_version: boundary_tablebase_h3_v2_coverage
emission: boundary_tablebase_closure
output: dth/artifacts/boundary_tablebase_h3_v2_coverage.npz
report_output: dth/artifacts/boundary_tablebase_h3_v2_coverage_report.json
progress_every: 1000

pairs:
  - {state: [239, 0, 0, 0], horizons: [1, 2, 3]}
  - {state: [240, 0, 0, 0], horizons: [1, 2, 3]}
  - {state: [200, 40, 0, 0], horizons: [1, 2, 3]}
  - {state: [200, 41, 0, 0], horizons: [1, 2, 3]}
  - {state: [179, 61, 0, 0], horizons: [1, 2, 3]}
  - {state: [179, 62, 0, 0], horizons: [1, 2, 3]}
  - {state: [60, 180, 0, 0], horizons: [1, 2, 3]}
  - {state: [60, 181, 0, 0], horizons: [1, 2, 3]}
  - {state: [240, 0, 200, 40], horizons: [1, 2, 3]}
  - {state: [200, 41, 240, 0], horizons: [1, 2, 3]}
  - {state: [239, 1, 179, 61], horizons: [1, 2, 3]}
  - {state: [239, 2, 179, 62], horizons: [1, 2, 3]}
  # Added counterexamples: c=60 live-success columns immediately below and
  # above the ST and ST+TTD boundary surfaces.  None is a development root.
  - {state: [238, 0, 0, 0], horizons: [1, 2, 3]}
  - {state: [241, 0, 0, 0], horizons: [1, 2, 3]}
  - {state: [180, 60, 0, 0], horizons: [1, 2, 3]}
  - {state: [180, 61, 0, 0], horizons: [1, 2, 3]}

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
