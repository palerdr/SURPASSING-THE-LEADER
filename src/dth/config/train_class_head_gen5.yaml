defaults:
  - train_class_head_v1
  - _self_

# Generation five of the expert-iteration loop. The anchor-leaf closure
# proved every leaf the depth-two anchor resolve queries already has a
# finite training row, so the binding constraint is fit, not coverage:
# multi-task trunk pressure lets anchor-leaf accuracy decay. The lever is
# the recorded alternative, heavier anchor frontier replay: the two leaf
# layers the anchor resolves evaluate join the replay stage, so every
# epoch spends dedicated gradient steps holding the finite head at the
# states the promotion gates actually measure.
dataset: src/dth/artifacts/class_head_gen5_corpus.npz
output_dir: src/dth/checkpoints/class_head_gen5
initial_checkpoint: src/dth/checkpoints/class_head_gen4/best.pt

model:
  transition_class_head: true
  play_value_head: true

exact_frontiers:
  groups:
    - name: h5_children
      repeats: 32
      roots:
        - state: [239, 0, 0, 240]
          horizon: 5
        - state: [0, 240, 239, 0]
          horizon: 5
    - name: retained_h4_children
      repeats: 64
      roots:
        - state: [239, 0, 0, 240]
          horizon: 4
    # Children of both h5 anchors, so the replayed frontier is the 7,442
    # grandchild states the depth-two h5 resolves evaluate at h3.
