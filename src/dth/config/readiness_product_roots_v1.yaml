defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

dataset_version: readiness_product_roots_v1
output: src/dth/artifacts/readiness_product_roots_v1.npz
emission: reachable_layers
horizon: 4
root_states:
  - [238, 0, 1, 240]
  - [1, 240, 238, 0]
  - [179, 60, 59, 180]
  - [59, 180, 179, 60]
  - [219, 0, 19, 240]
  - [19, 240, 219, 0]
  - [119, 120, 179, 60]
  - [179, 60, 119, 120]
base_datasets:
  - src/dth/artifacts/readiness_training_reference_v2.npz
progress_every: 250

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
