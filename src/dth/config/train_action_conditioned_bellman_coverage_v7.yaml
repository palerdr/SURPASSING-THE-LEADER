    - {state: [200, 41, 0, 0], horizon: 3}
    - {state: [0, 0, 200, 41], horizon: 3}
    - {state: [238, 0, 0, 0], horizon: 3}
    - {state: [0, 0, 238, 0], horizon: 3}
    - {state: [241, 0, 0, 0], horizon: 3}
    - {state: [0, 0, 241, 0], horizon: 3}
    - {state: [180, 60, 0, 0], horizon: 3}
    - {state: [0, 0, 180, 60], horizon: 3}
    - {state: [180, 61, 0, 0], horizon: 3}
    - {state: [0, 0, 180, 61], horizon: 3}

