defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_

# Generation-two corpus: accumulated play coverage, exact closures last so
# every collision resolves to the exact row.
dataset_version: class_head_gen2_corpus
output: src/dth/artifacts/class_head_gen2_corpus.npz
emission: merge
inputs:
  - src/dth/artifacts/resolve_labeled_gen1.npz
  - src/dth/artifacts/resolve_labeled_gen2.npz
  - src/dth/artifacts/readiness_training_reference_v2.npz

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
