defaults:
  - train
  - _self_

# Clean composition ablation: H1/H2 successor values are supervised directly;
# every H3 root label is excluded from row training and policies come only from
# solving the reconstructed matrix.
dataset: src/dth/artifacts/boundary_tablebase_h3_v1.npz
output_dir: src/dth/checkpoints/value_only_bellman_composition_v2
initial_checkpoint: src/dth/checkpoints/strategic_matrix_policy_generalization_balanced_v19/best.pt
seed: 4
device: cuda

model:
  hidden_width: 64
  hidden_layers: 2
  horizon_scale: 3.0
  feature_lift: boundary_v2

training:
  # Match the established v19 schedule; this is one objective ablation, not a
  # duration sweep.
  epochs: 60
  batch_size: 40
  learning_rate: 0.00001
  weight_decay: 0.00001
  validation_fraction: 0.2
  # No equilibrium-policy label CE: it is not used to choose root actions.
  policy_weight: 0.0
  selection_metric: decision
  patience: 120
  minimum_delta: 0.000001
  log_every: 10
  exclude_horizons: [3]
  horizon_batch:
    counts: {1: 20, 2: 20}
    batches_per_epoch: 24

audit:
  max_rows_per_horizon: 24

# Transition-level Bellman supervision. For every root/action pair, the target
# matrix is reconstructed from the real solver transition: terminal reward plus
# -V(child, h - 1) for each live child. There is no coordinate-swap loss and no
# policy-label or policy-mapping loss. One update per row batch matches the
# removed regularizer's update count without changing row-data exposure.
decision_loss:
  exact_targets: src/dth/artifacts/boundary_tablebase_h3_v1.npz
  repeats: 24
  saddle_gap_weight: 0.0
  matrix_weight: 1.0
  matrix_top_k: 3600
  guard_hinge_weight: 0.0
  roots:
    - {state: [239, 0, 0, 0], horizon: 3}
    - {state: [0, 0, 239, 0], horizon: 3}
    - {state: [240, 0, 0, 0], horizon: 3}
    - {state: [0, 0, 240, 0], horizon: 3}
    - {state: [200, 40, 0, 0], horizon: 3}
    - {state: [0, 0, 200, 40], horizon: 3}
    - {state: [200, 41, 0, 0], horizon: 3}
    - {state: [0, 0, 200, 41], horizon: 3}

# Disjoint development-only set. CVaR averages the worst three of twelve roots;
# every root is also a hard non-regression guard. Frozen readiness roots appear
# nowhere in this configuration.
decision_selection:
  exact_targets: src/dth/artifacts/boundary_tablebase_h3_v1.npz
  baseline_checkpoint: src/dth/checkpoints/strategic_matrix_policy_generalization_balanced_v19/best.pt
  solver_iterations: null
  solver_averaging_delay: 0
  ranking: cvar_saddle_gap
  cvar_alpha: 0.25
  # Exact LP selection is run at deterministic candidate checkpoints, including
  # epochs 1 and 60, rather than redundantly at every SGD epoch.
  evaluation_interval: 10
  guard_tolerance: 0.000001
  minimum_gap_improvement: 0.000001
  tie_tolerance: 0.000001
  roots: &development_roots
    - {state: [179, 61, 0, 0], horizon: 3}
    - {state: [0, 0, 179, 61], horizon: 3}
    - {state: [179, 62, 0, 0], horizon: 3}
    - {state: [0, 0, 179, 62], horizon: 3}
    - {state: [60, 180, 0, 0], horizon: 3}
    - {state: [0, 0, 60, 180], horizon: 3}
    - {state: [60, 181, 0, 0], horizon: 3}
    - {state: [0, 0, 60, 181], horizon: 3}
    - {state: [240, 0, 200, 40], horizon: 3}
    - {state: [200, 40, 240, 0], horizon: 3}
    - {state: [200, 41, 240, 0], horizon: 3}
    - {state: [240, 0, 200, 41], horizon: 3}
  guard_roots: *development_roots

# Kept wholly audit-only. The report records individual high-error cells,
# exact support membership, and which induced best response exposes each cell.
matrix_diagnosis:
  exact_targets: src/dth/artifacts/boundary_tablebase_h3_v1.npz
  top_cells: 12
  support_tolerance: 0.000001
  roots:
    - {state: [239, 1, 179, 61], horizon: 3}
    - {state: [179, 61, 239, 1], horizon: 3}
    - {state: [239, 2, 179, 62], horizon: 3}
    - {state: [179, 62, 239, 2], horizon: 3}

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
