defaults:
  - train_class_head_v1
  - _self_

# One recorded iteration on the M2 candidate: the first promotion run
# (src/dth/artifacts/promotion_v1.json) improved the evaluation median gap
# by 94.7% but regressed the three protected anchors past the 0.01 gate at
# depth-2 resolve.  This continuation raises anchor pressure five-fold and
# lowers the learning rate; everything else is inherited unchanged.
output_dir: src/dth/checkpoints/class_head_v2
initial_checkpoint: src/dth/checkpoints/class_head_v1/best.pt

