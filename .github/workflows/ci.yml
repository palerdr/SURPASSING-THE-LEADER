name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (${{ matrix.shard }}, -n ${{ matrix.width }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: stl
            width: 4
            os: ubuntu-latest
            select: -m "not slow" src/stl/tests
          - shard: stl
            width: 8
            os: ubuntu-latest
            select: -m "not slow" src/stl/tests
          - shard: rest
            width: 4
            os: ubuntu-latest
            select: -m "not slow" --ignore-glob='src/stl/tests/*'
          - shard: rest
            width: 8
            os: ubuntu-latest
            select: -m "not slow" --ignore-glob='src/stl/tests/*'
          - shard: slow
            width: 4
            os: ubuntu-latest
            select: -m slow
          - shard: slow
            width: 4
            os: ubuntu-24.04-arm
            select: -m slow
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # The leap builder calls math.fma, which Python 3.13 added.
          python-version: "3.13"
      - run: uv sync --dev
      - run: uv run python -m pytest --collect-only -q
      - run: uv run python -m pytest --collect-only -q ${{ matrix.select }} | tail -1
      # The numba leap kernel must reproduce the retired Rust kernel's golden
      # fixture. This step also compiles the kernel into its cache. The kernel
      # passes its inputs read-only, so writable and memmapped tables share
      # that compile, and the workers of the full run below load it.
      - name: Check the numba leap kernel against the Rust golden fixture
        if: matrix.shard == 'stl'
        run: uv run python -m pytest src/stl/tests/test_leap_golden.py -q -n 0 --durations=5
      - run: uv run python -m pytest -q ${{ matrix.select }} -n ${{ matrix.width }} --durations=25

  browser-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --project src/browser --frozen
      - run: uv run --project src/browser python -m pytest src/browser/tests tests/parity -q

  dth-compact:
    name: dth-compact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/dth_compact
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # numba supports Python below 3.15; without a pin uv takes the newest CPython.
          python-version: "3.13"
      - run: uv sync --dev
      - run: uv run pytest -q --durations=10

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/browser/webclient
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/browser/webclient/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build

  cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        preset:
          - debug
          - release
    defaults:
      run:
        working-directory: src/dth_cpp
    steps:
      - uses: actions/checkout@v6
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.preset }}-${{ hashFiles('src/dth_cpp/CMakeLists.txt') }}
          append-timestamp: false
          evict-old-files: job
      - run: >-
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build --preset ${{ matrix.preset }} --parallel "$(nproc)"
      - run: ctest --preset ${{ matrix.preset }}

  ocaml:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/dth_ocaml
    steps:
      - uses: actions/checkout@v6
      - name: Install GLPK
        run: |
          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo apt-get \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install --yes libglpk-dev
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"
          dune-cache: true
          opam-local-packages: src/dth_ocaml/*.opam
      - run: opam install . --deps-only --with-test --yes
      - run: opam exec -- dune build
      - run: opam exec -- dune runtest
      - run: opam exec -- dune build @fmt
